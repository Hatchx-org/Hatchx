name: Supabase keepalive

on:
  schedule:
    # Several database requests each day keep the rolling seven-day window active.
    - cron: "17 3,11,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query a public database table
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://www.hatchx.org' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT

          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            endpoint="${SUPABASE_URL%/}/rest/v1/site_content?select=key&limit=1"
            status="$({ curl --silent --show-error \
              --connect-timeout 15 \
              --max-time 45 \
              --retry 3 \
              --retry-all-errors \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "apikey: $SUPABASE_ANON_KEY" \
              --header "Accept: application/json" \
              "$endpoint"; } || true)"
            mode="direct Supabase"
          else
            endpoint="${SITE_URL%/}/api/health/database"
            status="$({ curl --silent --show-error \
              --connect-timeout 15 \
              --max-time 45 \
              --retry 3 \
              --retry-all-errors \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Accept: application/json" \
              --header "Cache-Control: no-cache" \
              "$endpoint"; } || true)"
            mode="deployed application"
          fi

          if ! [[ "$status" =~ ^[0-9]{3}$ ]] || [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "Supabase database query through $mode failed with HTTP ${status:-000}."
            sed -n '1,20p' "$response_file"
            exit 1
          fi

          echo "Supabase database query through $mode succeeded with HTTP $status."
